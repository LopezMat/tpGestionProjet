# Régénère TABLEAU.md (par projet) et PORTFOLIO.md (R9). Responsable : C · Lot 5.
# DEC-001 § 11 : commit seulement s'il y a des changements, avec [skip ci] et un groupe
# concurrency ; en cas de conflit, on régénère au lieu de résoudre à la main.
name: tableau

on:
  schedule:
    - cron: "0 6 * * *"    # chaque jour, 6 h UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tableau
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install -r requirements.txt
      - name: Régénérer, commiter si changement, pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branche="${GITHUB_REF_NAME}"
          for essai in 1 2 3; do
            python scripts/tableau.py
            fichiers=$(ls PORTFOLIO.md projets/*/TABLEAU.md 2>/dev/null || true)
            [ -n "$fichiers" ] && git add -- $fichiers
            if git diff --cached --quiet; then
              echo "Aucun changement : pas de commit."
              exit 0
            fi
            git commit -m "chore: régénère les tableaux de bord [skip ci]"
            if git push origin "HEAD:${branche}"; then
              exit 0
            fi
            echo "Push refusé (essai ${essai}) : on repart de la branche distante et on régénère."
            git fetch origin "${branche}"
            git reset --hard "origin/${branche}"
          done
          exit 1
